<!DOCTYPE html>
<html>
<head>
<title>First Aid Sound Effects</title>
</head>
<body>

<h1>This is a list of sound effects for the SNCO night</h1>

<h2>ㅤㅤㅤㅤㅤMaleㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤFemale</h2>
<h2>ㅤㅤㅤㅤㅤㅤㅤSteady Heavy Breathing</h2>

<audio controls loop class = "steady_heavy">
    <source src = "Steady_Heavy_Breathing_Male.m4a">
</audio>
<audio controls loop class = "steady_heavy">
    <source src = "Steady_Heavy_Breathing_Female.m4a">
</audio>
<h3 id = "sh_speed">Speed = </h3>

<div class="slidecontainer">
  <input type="range" min="0" max="5" value="1" step="0.1" class="slider" id="slider_sh">
</div>


<!--sh_speed = steady heavy speed, g_speed = groan speed-->

<h2>ㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤGroans</h2>
<audio controls loop class = "groan">
    <source src = "Male_Groan.mp3">
</audio>
<audio controls loop class = "groan">
    <source src = "Female_Groan.mp3">
</audio>
<h3 id = "g_speed">Speed = </h3>


<div class="slidecontainer">
  <input type="range" min="0" max="5" value="1" step="0.1" class="slider" id="slider_g">
</div>




<script>
let sh_speed = document.getElementById("sh_speed");
let steady_heavy = document.getElementsByClassName("steady_heavy");
let slider_sh = document.getElementById("slider_sh");

let g_speed = document.getElementById("g_speed");
let groan = document.getElementsByClassName("groan");
let slider_g = document.getElementById("slider_g");


steady_heavy[0].playbackRate = slider_sh.value;
steady_heavy[1].playbackRate = slider_sh.value;
sh_speed.innerHTML = "Speed = "+slider_sh.value;

groan[0].playbackRate = slider_g.value;
groan[1].playbackRate = slider_g.value;
g_speed.innerHTML = "Speed = "+slider_g.value;


slider_sh.oninput = function() { 
  steady_heavy[0].playbackRate = this.value;
  steady_heavy[1].playbackRate = this.value;
  sh_speed.innerHTML = "Speed = "+this.value;
} 

slider_g.oninput = function() { 
  groan[0].playbackRate = this.value;
  groan[1].playbackRate = this.value;
  g_speed.innerHTML = "Speed = "+this.value;
} 
</script> 
</body>
</html>
